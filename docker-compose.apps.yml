# The two applications written for this exercise. The supplied compose file is
# left as delivered; this one adds only what it does not provide.
#
# Merge both files so everything shares one network and the services can reach
# each other by name:
#
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up --build
services:
  # The supplied API, built from a Dockerfile that adds the three packages its
  # own is missing. Without them `npm ci` cannot build @parcel/watcher from
  # source and the image does not build at all on Apple Silicon (finding 8 in
  # NOTES.md). Everything else about the service is inherited unchanged, and
  # both supplied files stay as delivered.
  eurocamp-api:
    build:
      dockerfile: ./docker/eurocamp-api.Dockerfile

  bff-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    # No volume on purpose. The cache is a safety net holding the last known
    # good upstream payload — losing it costs a fallback, never data.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # A key browser for the safety net. What is actually in the cache is the
  # question this design raises — how old the fallback for a key is, whether
  # anything is there at all before an outage starts — and answering it
  # otherwise means `redis-cli` inside a container.
  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    environment:
      # Skip the connection wizard: the only database here is ours.
      - RI_REDIS_HOST=bff-redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=BFF safety net
      # Otherwise the first thing anyone opening this sees is a consent form.
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
    ports:
      - 5540:5540
    depends_on:
      bff-redis:
        condition: service_healthy

  # Traces. Single binary, no collector in front of it — one more hop to run
  # and configure buys nothing at this size, and the SDK batches anyway.
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: unless-stopped
    environment:
      # Defaults keep a local `up` working with no .env. A deployment that is
      # reachable from anywhere sets both of these, because this file is public.
      - ZO_ROOT_USER_EMAIL=${OPENOBSERVE_EMAIL:-root@example.com}
      - ZO_ROOT_USER_PASSWORD=${OPENOBSERVE_PASSWORD:-Complexpass#123}
    ports:
      - 5080:5080
    # No volume: traces from a local run are worth less than the disk, and a
    # fresh store per run makes "what did that request do" easier to answer.
    healthcheck:
      test: ['CMD', '/openobserve', '--help']
      interval: 5s
      timeout: 3s
      retries: 10

  bff:
    build:
      context: ./apps/bff
    restart: unless-stopped
    environment:
      # Inside the network this is the container's own port, not the 3001 the
      # supplied compose file publishes to the host.
      - UPSTREAM_BASE_URL=http://eurocamp-api:8080/api/1
      - REDIS_URL=redis://bff-redis:6379
      # Traces are off entirely when this is unset, which is how the BFF runs
      # outside compose. `default` is the OpenObserve organisation.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5080/api/default
      # base64 of the two variables above, which compose cannot compute — so a
      # changed password means changing this too. The default is the default pair.
      - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic ${OPENOBSERVE_BASIC_AUTH:-cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyMxMjM=}
    ports:
      - 3002:3002
    depends_on:
      bff-redis:
        condition: service_healthy
      eurocamp-api:
        condition: service_started
      openobserve:
        condition: service_started
    healthcheck:
      # node:22-slim carries no curl, and Node has fetch built in.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/breakers').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      # A service name resolves here only because every fetch to the BFF happens
      # server-side. A client component fetching it directly would need the
      # host address instead, and the two would have to diverge.
      - BFF_URL=http://bff:3002
    ports:
      - 3000:3000
    depends_on:
      bff:
        condition: service_healthy
